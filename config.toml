# ==========================================
# Discord Webhookの設定
# ==========================================
# ★ここに取得したDiscordのWebhook URLを貼り付けてください
webhook_url = "https://discord.com/api/webhooks/あなたのURLをここに貼り付けてください"

# ==========================================
# 店舗の設定 (Apple Store)
# ==========================================
[stores]
# 特定の店舗のみを監視するため、zip_codeは空にしておきます
zip_code = ""

# 監視したい店舗のID
stores = [
    "R119", # Apple 渋谷
    "R111", # Apple 表参道
    "R711"  # Apple 新宿
]

# ==========================================
# 製品の設定 (iPhone 17 Pro)
# ==========================================
[devices]
# 監視したいモデルの型番（Part Number）
models = [
    "MG854J/A", # iPhone 17 Pro 256GB シルバー
    "MG864J/A", # iPhone 17 Pro 256GB コスミックオレンジ
    "MG874J/A", # iPhone 17 Pro 256GB ディープブルー
    "MG894J/A", # iPhone 17 Pro 512GB シルバー
    "MG8A4J/A", # iPhone 17 Pro 512GB コスミックオレンジ
    "MG8C4J/A"  # iPhone 17 Pro 512GB ディープブルー
]

# ==========================================
# Telegramの設定 (ダミー)
# ==========================================
# ※プログラム側のエラー（設定見つからないエラー）を回避するためのダミーデータです。
# Discord通知を使う場合は機能しませんが、このまま残しておいてください。
[telegram]
api_id = 123456
api_hash = "dummy_hash"
bot_token = "dummy_token"
chat_id = "dummy_chat_id"
